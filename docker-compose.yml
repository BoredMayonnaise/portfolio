services:
  web:
    build: .
    container_name: portfolio-web
    restart: unless-stopped
    user: "1001:1001"
    env_file: .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./templates:/app/templates
      - ./static:/app/static
      - ./core:/app/core
    expose:
      - "1001"
    networks:
      - default
      - coolify
    ports:
      - "127.0.0.1:1001:1001"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - legacy-nginx
    depends_on:
      - web
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ../deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../deploy/docker/raqnith.conf:/etc/nginx/conf.d/raqnith.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /home/ubuntu/raqnith/staticfiles:/var/www/raqnith-static:ro
      - ./staticfiles:/app/staticfiles:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: portfolio-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    profiles:
      - legacy-n8n
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
      - "ollama.internal:172.18.0.1"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
      - N8N_INSTANCE_AI_MODEL=custom/qwen2.5:1.5b
      - N8N_INSTANCE_AI_MODEL_URL=http://ollama.internal:11434/v1
      - N8N_INSTANCE_AI_MODEL_API_KEY=ollama
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

networks:
  coolify:
    external: true
