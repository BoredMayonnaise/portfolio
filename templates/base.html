{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}mark ocampos — engineer · cryptographer · photographer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
  <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{% url 'core:home' %}">mark ocampos<span class="dot">.</span></a>
      <nav>
        <a href="{% url 'core:home' %}">home</a>
        <a href="{% url 'core:project_list' %}">work</a>
        <a href="{% url 'core:blog_list' %}">journal</a>
        <a href="{% url 'core:contact' %}">contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="mono">your data, my responsibility · built by hand, no tracker</p>
      <p class="mono">icons by <a href="https://koboyo.com" target="_blank" rel="noopener">koboyo</a> · powered by <a href="https://www.djangoproject.com/" target="_blank" rel="noopener">django</a></p>
    </div>
  </footer>
</body>
</html>
