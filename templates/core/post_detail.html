{% extends "base.html" %}

{% block title %}{{ post.title }} | mark ocampos{% endblock %}

{% block content %}
<article class="detail hero-anim">
  <p class="eyebrow mono">journal · {{ post.created_at|date:"F j, Y" }}</p>
  <h1>{{ post.title }}</h1>
  <div class="body">
    {{ post.body|linebreaks }}
  </div>
  <p class="mono back"><a href="{% url 'core:blog_list' %}">← back to /journal</a></p>
</article>
{% endblock %}
